[pytest]
testpaths = tests
addopts = -q --strict-markers
markers =
    browser: drives the real page in headless Chromium via Node + Playwright (skipped when unavailable)
    bdd: Gherkin scenarios (tests/features) exercising whole flows with stubbed Yahoo/FMP and a fake Upstox server
filterwarnings =
    ignore::DeprecationWarning
